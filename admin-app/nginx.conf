# Serves the built React app and proxies API calls to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API + health -> backend service on the compose network.
    # "backend" is the service name in docker-compose.yml. We use Docker's
    # embedded DNS (127.0.0.11) with a variable upstream so nginx re-resolves
    # the backend's IP if its container restarts (instead of caching a stale IP
    # at startup and breaking until nginx is reloaded).
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # retraining can take a moment
    }
    location = /health {
        set $backend_h backend;
        proxy_pass http://$backend_h:8000/health;
    }

    # SPA fallback: every non-file route serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
