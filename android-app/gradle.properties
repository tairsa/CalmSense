# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Gradle configuration cache — skips configuration phase on incremental
# builds when the build inputs haven't changed. Significant speedup for
# repeated :app:assembleDebug / :wear:installDebug cycles during dev.
org.gradle.configuration-cache=true
# ---------------------------------------------------------------------------
# The single source of truth for the app version. Semantic versioning:
# MAJOR.MINOR.PATCH. Bump the patch for every build Alex confirms on a real
# device; minor for user-visible features; major for a breaking change.
#
# The phone and watch modules both read this so they can never drift apart -
# they share an applicationId and pair over the Data Layer, so a mismatched
# pair is exactly the kind of thing that produces a confusing bug report.
# versionCode is derived from it in the root build file; never set by hand.
# ---------------------------------------------------------------------------
calmsense.versionName=1.0.0
